<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 732"><rect width="1300" height="732" fill="#ebe9e1"/><text x="36" y="105" font-family="Arial Black,Arial" font-size="100" font-weight="900">PROBLEMS</text><text x="38" y="170" font-family="Arial" font-size="24">+ 60% of food waste happens at home</text><text x="650" y="170" font-family="Arial" font-size="24">+ ~30% of fresh fruit is thrown away at home</text><rect x="40" y="210" width="620" height="120" fill="#f3dc56"/><text x="60" y="258" font-family="Arial" font-size="26" font-weight="700">Key problem: no clear, real-time indicator</text><text x="60" y="296" font-family="Arial" font-size="26" font-weight="700">of when fruit is edible.</text><text x="36" y="445" font-family="Arial Black,Arial" font-size="100" font-weight="900">SOLUTION</text><rect x="85" y="500" rx="12" width="190" height="70" fill="#f3dc56"/><rect x="300" y="500" rx="12" width="190" height="70" fill="#f3dc56"/><rect x="515" y="500" rx="12" width="190" height="70" fill="#b3bd33"/><text x="120" y="545" font-family="Arial" font-size="24" font-weight="800">ACTIVE</text><text x="347" y="545" font-family="Arial" font-size="24" font-weight="800">SMART</text><text x="540" y="545" font-family="Arial" font-size="24" font-weight="800">CONTAINER</text><circle cx="1030" cy="350" r="170" fill="#ffb515" opacity=".8"/><circle cx="1060" cy="335" r="110" fill="#8f2d57"/><circle cx="1095" cy="360" r="58" fill="#f6efe3"/></svg>