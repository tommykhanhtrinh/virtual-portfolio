<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2025–2026 · Push Back | Trình</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:system-ui,sans-serif;color:#07111f}
    .loader{min-height:100vh;display:grid;place-items:center;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:#64748b}
  </style>
</head>
<body>
  <div class="loader">Loading Push Back season…</div>
  <script>
  (async()=>{
    try{
      const res=await fetch('vex-2025-2026-base.html',{cache:'no-store'});
      if(!res.ok) throw new Error('Could not load season source');
      let html=await res.text();
      const swap=(from,to)=>{html=html.split(from).join(to)};

      swap(
        `Back in Vietnam, we carried Taiwan lessons into a stronger competition version and earned judged-award recognition.`,
        `Back in Vietnam, we carried Taiwan lessons into a stronger competition version and earned the Create Award.`
      );
      swap(`Design + Create Award`,`Create Award`);

      swap(
        `Besides the real build photos, these two CAD renders show how we were also preparing conceptually for SSIS Scrimmage. They capture the robot in a more planned, pre-event state — a bridge between design intent and the physical machine that later went onto the field.`,
        `Besides the real build photos, these two CAD renders show the same robot model from two different angles. Together, they show how the design looked before the physical machine went onto the field.`
      );
      swap(`Prep stage · CAD concept A`,`Same CAD model · view 01`);
      swap(`Prep stage · CAD concept B`,`Same CAD model · view 02`);
      swap(`CAD concept A`,`CAD view 01`);
      swap(`CAD concept B`,`CAD view 02`);

      swap(
        `We finished the event as tournament finalists, and according to my CV, we were ranked <strong>3rd in qualification rounds</strong> — an encouraging start for the Push Back season.`,
        `We finished the event as tournament finalists and ranked <strong>3rd in qualification rounds</strong> — an encouraging start for the Push Back season.`
      );
      swap(`<span>As listed in CV</span>`,`<span>Qualification result</span>`);
      swap(
        `That is what makes this event important in the portfolio story: it marks the transition from preparation to proof.`,
        `For me, this event marks the transition from preparation to proof — the point when our early ideas had to work in real matches.`
      );

      swap(
        `<h3>The portfolio becomes more authentic.</h3><p>Using real high-resolution photos from each stage turns the website into more than a highlight reel. It becomes a documented engineering journey from scrimmage to regional rebuild and then into the concept shift for Taiwan Signature Event.</p>`,
        `<h3>The process is visible, not just the result.</h3><p>Real photos from each stage make it possible to trace the engineering journey from scrimmage to the regional rebuild and then into the concept shift for Taiwan Signature Event.</p>`
      );

      swap(
        `One of the clearest lessons from this event was the same idea I later reflected on in my statement of purpose: top teams treat every tournament as feedback. They do not wait for a robot to become perfect before testing it; they use competition itself as another engineering environment.`,
        `One of the clearest lessons from this event was that top teams treat every tournament as feedback. They do not wait for a robot to become perfect before testing it; they use competition itself as another engineering environment.`
      );
      swap(`<strong>Storytelling note</strong>`,`<strong>Engineering reflection</strong>`);
      swap(
        `<strong>Statement-of-purpose connection</strong><p>Taiwan Signature Event perfectly matched one of the biggest ideas in my statement of purpose: I moved from a more freestyle building mindset to a deliberate engineering process — plan, CAD, test, revise, compare versions, and rebuild with purpose.</p>`,
        `<strong>What changed in my process</strong><p>Taiwan made the shift clear: I was moving from a more freestyle building mindset to a deliberate engineering process — plan, CAD, test, revise, compare versions, and rebuild with purpose.</p>`
      );

      swap(
        `a national-level performance that reflected both competitive growth and judged-award quality.`,
        `a national-level performance that reflected both competitive growth and a more refined engineering process.`
      );
      swap(
        `<div class="cloud-card"><strong>Judged-award recognition</strong><span>CV-linked achievement</span><p>The season work was recognized with the <strong>Design Award</strong> and the <strong>Create Award</strong>, matching the achievements already recorded on my CV.</p></div>`,
        `<div class="cloud-card"><strong>Create Award</strong><span>Judged recognition</span><p>The award recognized the creativity and refinement behind the robot we brought to Nationals.</p></div>`
      );
      swap(
        `What I value most about this chapter is not only the awards. It is the cause-and-effect story behind them: Taiwan exposed higher standards, I brought those lessons back, and the National Championship became the place where those lessons finally turned into stronger execution and visible results.`,
        `What I value most about this chapter is not only the award. It is the cause-and-effect behind it: Taiwan exposed higher standards, we brought those lessons back, and Nationals became the place where they turned into stronger execution and visible results.`
      );
      swap(`<span>design award</span><span>create award</span>`,`<span>create award</span><span>refined execution</span>`);
      swap(
        `The awards and event photos matter most when connected back to the engineering process. The National Championship did not appear out of nowhere.`,
        `The Create Award and the event itself mattered because they grew out of the work that came before. Nationals did not appear out of nowhere.`
      );
      swap(
        `<h3>Recognition is strongest when it matches the story.</h3><p>The National Championship achievements fit naturally into my CV because they show a clear arc of growth instead of one isolated success.</p>`,
        `<h3>Recognition matters when it reflects the process.</h3><p>The Create Award meant more because it came after a clear chain of rebuilding, testing, and learning rather than as one isolated result.</p>`
      );
      swap(
        `<strong>CV and portfolio connection</strong><p>This is why the National Championship chapter belongs on the page: it completes the storytelling arc from Taiwan learning to national-level recognition, while keeping the achievements aligned with the same results already written on my CV.</p>`,
        `<strong>Why Nationals mattered</strong><p>Nationals connected the lessons from Taiwan with a stronger robot, calmer pit work, and better execution under pressure. It showed that improvement carried from one event can change what happens at the next one.</p>`
      );

      swap(`CV-linked result · Vietnam Signature Event`,`Vietnam Signature Event · Robot Skills`);

      swap(
        `<div class="identity-photo vertex-crop" data-fullsrc="assets/pushback/worlds_before_sendoff.jpg" data-caption="Vertex members within the wider LSTS Worlds send-off community."><img src="assets/pushback/worlds_before_sendoff.jpg" alt="Vertex members in LSTS Worlds send-off photo"></div>`,
        `<div class="identity-photo" data-fullsrc="assets/pushback/worlds_match_team_fieldside.jpg" data-caption="Vertex 50922S together at fieldside during VEX Worlds."><img src="assets/pushback/worlds_match_team_fieldside.jpg" alt="Vertex 50922S team at fieldside during VEX Worlds"></div>`
      );

      html=html.replace(/according to my CV,?\s*/gi,'');
      html=html.replace(/as listed in CV/gi,'Qualification result');
      html=html.replace(/CV-linked achievement/gi,'Judged recognition');
      html=html.replace(/CV-linked result/gi,'Event result');
      html=html.replace(/matching the achievements already recorded on my CV\.?/gi,'');
      html=html.replace(/one of the biggest ideas in my statement of purpose:/gi,'the shift I was experiencing in my own engineering process:');
      html=html.replace(/the same idea I later reflected on in my statement of purpose:/gi,'a lesson that became central to my engineering process:');
      html=html.replace(/portfolio story/gi,'season story');

      html=html.replace(
        /<footer class="footer"><div class="container">[\s\S]*?<\/div><\/footer>/,
        `<footer class="footer"><div class="container">2025–2026 Push Back season · from SSIS Scrimmage through the Vietnam Signature Event to the VEX Robotics World Championship · rebuilding, testing, international learning, competition, and the people behind the robot.</div></footer>`
      );
      html=html.replace(/Expanded portfolio image/gi,'Expanded season image');

      html=html.replace(
        `</style>`,
        `#worlds-before .sendoff-mini img{object-position:88% 48%!important}\n</style>`
      );

      document.open();
      document.write(html);
      document.close();
    }catch(err){
      console.error(err);
      document.querySelector('.loader').textContent='Unable to load this season page.';
    }
  })();
  </script>
</body>
</html>
