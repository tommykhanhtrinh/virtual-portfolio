name: Deploy GitHub Pages with optimized current VEX model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          mkdir -p _site/assets

      - name: Download latest full-resolution VEX CAD
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/vex-card-robot-full.glb"
          curl -L --fail --retry 5 --retry-delay 5 \
            -o "$SOURCE" \
            https://github.com/tommykhanhtrinh/virtual-portfolio/releases/download/vex-card-cad-v1/vex-card-robot-full.glb
          test "$(stat -c%s "$SOURCE")" = "493754592"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "Original CAD: $(du -h "$SOURCE" | cut -f1)"

      - name: Install gltfpack
        shell: bash
        run: |
          set -euo pipefail
          npm install -g gltfpack@latest
          gltfpack -v

      - name: Build browser-optimized current robot
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          OUT="_site/assets/robot-current-optimized.glb"
          TMP="$RUNNER_TEMP/robot-current-candidate.glb"
          TARGET=95000000
          MAX=99000000

          echo "Pass 1: quantization + meshoptimizer compression, preserving full mesh topology."
          gltfpack -i "$SOURCE" -o "$TMP" -cc -kn
          SIZE=$(stat -c%s "$TMP")
          echo "Pass 1 size: $SIZE bytes"

          if [ "$SIZE" -le "$MAX" ]; then
            cp "$TMP" "$OUT"
            echo "Full geometry fits below the Pages-safe target; no triangle simplification used."
          else
            RATIO=$(python - <<PY
          size=$SIZE
          target=$TARGET
          r=max(0.12,min(0.92,(target/size)*0.88))
          print(f"{r:.4f}")
          PY
            )
            echo "Pass 2: permissive simplification ratio $RATIO"
            gltfpack -i "$SOURCE" -o "$OUT" -cc -kn -si "$RATIO" -sp
            SIZE=$(stat -c%s "$OUT")
            echo "Pass 2 size: $SIZE bytes"

            if [ "$SIZE" -gt "$MAX" ]; then
              RATIO2=$(python - <<PY
          r=float("$RATIO")
          size=$SIZE
          target=$TARGET
          r2=max(0.08,min(r*0.88,r*(target/size)*0.90))
          print(f"{r2:.4f}")
          PY
              )
              echo "Pass 3: ratio $RATIO2"
              gltfpack -i "$SOURCE" -o "$OUT" -cc -kn -si "$RATIO2" -sp
              SIZE=$(stat -c%s "$OUT")
              echo "Pass 3 size: $SIZE bytes"
            fi
          fi

          FINAL_SIZE=$(stat -c%s "$OUT")
          test "$FINAL_SIZE" -lt 100000000
          MAGIC=$(head -c 4 "$OUT")
          test "$MAGIC" = "glTF"

          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          python - <<PY
          import json
          from pathlib import Path
          meta = {
              "sourceBytes": 493754592,
              "optimizedBytes": $FINAL_SIZE,
              "optimizedMiB": round($FINAL_SIZE / 1024 / 1024, 2),
              "sha256": "$SHA",
              "compression": "gltfpack meshopt + quantization; adaptive simplification only when required",
          }
          Path('_site/assets/robot-current-optimized.json').write_text(json.dumps(meta, indent=2))
          print(json.dumps(meta, indent=2))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify optimized robot is publicly served
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          MODEL="${BASE}assets/robot-current-optimized.glb"
          META="${BASE}assets/robot-current-optimized.json"

          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -L --fail --silent --show-error "$META" -o /tmp/robot-meta.json; then
              break
            fi
            echo "Waiting for Pages CDN propagation ($attempt/8)..."
            sleep 10
          done

          cat /tmp/robot-meta.json
          SIZE=$(python -c "import json;print(json.load(open('/tmp/robot-meta.json'))['optimizedBytes'])")
          test "$SIZE" -lt 100000000

          curl -L --fail --silent --show-error --range 0-3 "$MODEL" -o /tmp/glb-magic
          test "$(cat /tmp/glb-magic)" = "glTF"
          echo "Optimized latest VEX model is live: $SIZE bytes."
