name: Deploy GitHub Pages with full-res VEX model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          mkdir -p _site/assets/vex-card-cad

      - name: Download and split full-resolution VEX CAD
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/vex-card-robot-full.glb"
          curl -L --fail --retry 5 --retry-delay 5 \
            -o "$SOURCE" \
            https://github.com/tommykhanhtrinh/virtual-portfolio/releases/download/vex-card-cad-v1/vex-card-robot-full.glb

          test "$(stat -c%s "$SOURCE")" = "493754592"
          SOURCE_SHA="$(sha256sum "$SOURCE" | awk '{print $1}')"
          echo "Source SHA256: $SOURCE_SHA"

          split -b 32M -d -a 3 "$SOURCE" _site/assets/vex-card-cad/chunk-

          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('_site/assets/vex-card-cad')
          files = sorted(root.glob('chunk-*'))
          total = sum(p.stat().st_size for p in files)
          expected = 493_754_592
          if total != expected:
              raise SystemExit(f'Chunk total {total} != expected {expected}')

          manifest = {
              'version': 1,
              'format': 'glb-chunks',
              'totalBytes': total,
              'chunkCount': len(files),
              'chunks': [
                  {'url': f'vex-card-cad/{p.name}', 'size': p.stat().st_size}
                  for p in files
              ],
          }
          Path('_site/assets/vex-card-robot-full.glb.manifest.json').write_text(
              json.dumps(manifest, separators=(',', ':')),
              encoding='utf-8',
          )
          print(f'Created {len(files)} chunks totaling {total} bytes')
          PY

          CHUNK_SHA="$(cat _site/assets/vex-card-cad/chunk-* | sha256sum | awk '{print $1}')"
          test "$CHUNK_SHA" = "$SOURCE_SHA"
          echo "Chunked copy is byte-for-byte identical to the 493754592-byte source."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify chunked CAD is publicly served
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          MANIFEST="${BASE}assets/vex-card-robot-full.glb.manifest.json"

          for attempt in 1 2 3 4 5 6; do
            if curl -L --fail --silent --show-error "$MANIFEST" -o /tmp/manifest.json; then
              break
            fi
            echo "Waiting for Pages CDN propagation ($attempt/6)..."
            sleep 10
          done

          python - <<'PY'
          import json
          m = json.load(open('/tmp/manifest.json'))
          assert m['totalBytes'] == 493754592
          assert m['chunkCount'] == len(m['chunks'])
          print('Manifest OK:', m['chunkCount'], 'chunks')
          print('First:', m['chunks'][0]['url'])
          print('Last:', m['chunks'][-1]['url'])
          PY

          FIRST="$(python -c "import json;print(json.load(open('/tmp/manifest.json'))['chunks'][0]['url'])")"
          LAST="$(python -c "import json;print(json.load(open('/tmp/manifest.json'))['chunks'][-1]['url'])")"
          curl -L --fail --silent --show-error --head "${BASE}assets/${FIRST}" >/dev/null
          curl -L --fail --silent --show-error --head "${BASE}assets/${LAST}" >/dev/null
          echo "Public chunk endpoints are reachable."
