name: Deploy GitHub Pages with optimized current VEX model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          mkdir -p _site/assets

      - name: Build homepage hover portrait
        shell: bash
        run: |
          set -euo pipefail
          cat \
            assets/portrait-hover/part-0.txt \
            assets/portrait-hover/part-1.txt \
            assets/portrait-hover/part-2.txt \
            assets/portrait-hover/part-3.txt \
            assets/portrait-hover/part-4.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            > _site/assets/portrait-hover.webp
          test "$(stat -c%s _site/assets/portrait-hover.webp)" = "36922"
          test "$(sha256sum _site/assets/portrait-hover.webp | awk '{print $1}')" = "7435a09b213e049214d07eef7be2a766d5ffdb4b783d34d377b8de4a4ae2df0e"
          echo "Homepage hover portrait reconstructed successfully."

      - name: Download latest full-resolution VEX CAD
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/vex-card-robot-full.glb"
          curl -L --fail --retry 5 --retry-delay 5 \
            -o "$SOURCE" \
            https://github.com/tommykhanhtrinh/virtual-portfolio/releases/download/vex-card-cad-v1/vex-card-robot-full.glb
          test "$(stat -c%s "$SOURCE")" = "493754592"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "Original CAD: $(du -h "$SOURCE" | cut -f1)"

      - name: Install gltfpack
        shell: bash
        run: |
          set -euo pipefail
          npm install -g gltfpack@latest
          gltfpack -v

      - name: Build browser-compatible current robot
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          OUT="_site/assets/robot-current-optimized.glb"
          TMP="$RUNNER_TEMP/robot-current-candidate.glb"
          TARGET=92000000
          MAX=99000000

          echo "Pass 1: optimize + quantize without meshopt compression extension."
          gltfpack -i "$SOURCE" -o "$TMP" -kn
          SIZE=$(stat -c%s "$TMP")
          echo "Pass 1 size: $SIZE bytes"

          if [ "$SIZE" -le "$MAX" ]; then
            cp "$TMP" "$OUT"
            RATIO=1.0
            echo "Full geometry fits below 100 MB without compressed-buffer extensions."
          else
            RATIO=$(python - <<PY
          size=$SIZE
          target=$TARGET
          r=max(0.10,min(0.95,(target/size)*0.92))
          print(f"{r:.4f}")
          PY
            )

            for PASS in 2 3 4 5; do
              echo "Pass $PASS: standard GLB, permissive simplification ratio $RATIO"
              gltfpack -i "$SOURCE" -o "$OUT" -kn -si "$RATIO" -sp
              SIZE=$(stat -c%s "$OUT")
              echo "Pass $PASS size: $SIZE bytes"
              if [ "$SIZE" -le "$MAX" ]; then
                break
              fi
              RATIO=$(python - <<PY
          r=float("$RATIO")
          size=$SIZE
          target=$TARGET
          r2=max(0.06,min(r*0.90,r*(target/size)*0.92))
          print(f"{r2:.4f}")
          PY
              )
            done
          fi

          FINAL_SIZE=$(stat -c%s "$OUT")
          test "$FINAL_SIZE" -lt 100000000
          MAGIC=$(head -c 4 "$OUT")
          test "$MAGIC" = "glTF"

          # Confirm the deployed GLB does NOT require EXT_meshopt_compression.
          python - <<'PY'
          import json, struct
          from pathlib import Path
          p = Path('_site/assets/robot-current-optimized.glb')
          data = p.read_bytes()
          if data[:4] != b'glTF':
              raise SystemExit('Invalid GLB magic')
          json_len, json_type = struct.unpack_from('<II', data, 12)
          if json_type != 0x4E4F534A:
              raise SystemExit('First GLB chunk is not JSON')
          doc = json.loads(data[20:20+json_len].decode('utf-8').rstrip('\x00 '))
          used = doc.get('extensionsUsed', [])
          required = doc.get('extensionsRequired', [])
          print('extensionsUsed:', used)
          print('extensionsRequired:', required)
          if 'EXT_meshopt_compression' in used or 'EXT_meshopt_compression' in required:
              raise SystemExit('Unexpected EXT_meshopt_compression in browser-safe GLB')
          PY

          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          python - <<PY
          import json
          from pathlib import Path
          meta = {
              "sourceBytes": 493754592,
              "optimizedBytes": $FINAL_SIZE,
              "optimizedMiB": round($FINAL_SIZE / 1024 / 1024, 2),
              "sha256": "$SHA",
              "simplificationRatio": "$RATIO",
              "format": "standard GLB; no EXT_meshopt_compression",
              "optimization": "gltfpack quantization + geometry optimization; adaptive simplification only as needed for <100 MB",
          }
          Path('_site/assets/robot-current-optimized.json').write_text(json.dumps(meta, indent=2))
          print(json.dumps(meta, indent=2))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify optimized robot and hover portrait are publicly served
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          MODEL="${BASE}assets/robot-current-optimized.glb"
          META="${BASE}assets/robot-current-optimized.json"
          PORTRAIT="${BASE}assets/portrait-hover.webp"

          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -L --fail --silent --show-error "$META" -o /tmp/robot-meta.json; then
              break
            fi
            echo "Waiting for Pages CDN propagation ($attempt/8)..."
            sleep 10
          done

          cat /tmp/robot-meta.json
          SIZE=$(python -c "import json;print(json.load(open('/tmp/robot-meta.json'))['optimizedBytes'])")
          test "$SIZE" -lt 100000000

          curl -L --fail --silent --show-error --range 0-3 "$MODEL" -o /tmp/glb-magic
          test "$(cat /tmp/glb-magic)" = "glTF"
          echo "Browser-compatible latest VEX model is live: $SIZE bytes."

          curl -L --fail --silent --show-error "$PORTRAIT" -o /tmp/portrait-hover.webp
          test "$(stat -c%s /tmp/portrait-hover.webp)" = "36922"
          echo "Homepage hover portrait is live."
